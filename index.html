<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choice Wellbeing Reception Terminal</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #2d3748;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
            box-sizing: border-box;
        }
        #terminal-card {
            text-align: center;
            width: 95%;
            max-width: 500px;
            background-color: #ffffff;
            padding: 10px;
        }
        .logo-container { margin-bottom: 15px; }
        .logo-container img { max-width: 240px; height: auto; }
        h1 { font-size: 26px; color: #1a202c; font-weight: 600; margin: 0 0 8px 0; }
        p { color: #4a5568; font-size: 16px; margin: 0 0 25px 0; font-weight: 300; }
        
        /* Premium Tab Toggle Design - Blends seamlessly into original theme */
        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #2f855a;
            border-bottom: 4px solid #2f855a;
        }

        /* Viewpanes */
        .form-pane { display: none; }
        .form-pane.active { display: block; }
        
        .input-group {
            margin-bottom: 18px;
            text-align: left;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #718096;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .optional-tag { font-size: 11px; color: #a0aec0; text-transform: none; font-weight: normal; }
        input, select {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            background-color: #f7fafc;
            color: #2d3748;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, select:focus { border-color: #2f855a; background-color: #ffffff; }
        
        .submit-btn {
            width: 85%;
            background-color: #2f855a; 
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(47, 133, 90, 0.2);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        .submit-btn:active { transform: scale(0.98); }
        
        /* 1-Click Sign-Out Layout Grid */
        .signout-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 85%;
            margin: 15px auto;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .name-tap-button {
            width: 100%;
            background-color: #f7fafc;
            color: #2d3748;
            border: 2px solid #e2e8f0;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .name-tap-button:active {
            background-color: #edf2f7;
            border-color: #2f855a;
            transform: scale(0.99);
        }
        .no-visitors {
            color: #718096;
            font-style: italic;
            padding: 20px;
            font-size: 15px;
        }
        
        #status-display {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #2f855a; 
            min-height: 32px;
        }
    </style>
</head>
<body>

    <div id="terminal-card">
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/danhugs87/Choice-reception-kiosk/main/2.png" alt="Choice Wellbeing Service" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
            <h2 id="logo-text" style="display:none; color:#2c4a3e; margin:0 0 15px 0; font-size:28px; letter-spacing:1px;">CHOICE WELLBEING</h2>
        </div>
        
        <h1>Welcome to Choice Wellbeing Service</h1>
        <p>Please check in or out for your appointment below</p>
        
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-btn" onclick="switchTab('signout')">Sign Out</button>
        </div>
        
        <div id="signin-pane" class="form-pane active">
            <div class="input-group">
                <label for="client-name">Your Full Name</label>
                <input type="text" id="client-name" placeholder="e.g. Jane Smith" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="client-email">Email Address</label>
                <input type="email" id="client-email" placeholder="e.g. jane@example.com" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="car-reg">Car Registration <span class="optional-tag">(Leave blank if you arrived by bus/walk)</span></label>
                <input type="text" id="car-reg" placeholder="e.g. AB12 CDE" style="text-transform: uppercase;" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="staff-select">Who are you here to see?</label>
                <select id="staff-select">
                    <option value="" disabled selected>Select a practitioner...</option>
                    <option value="Tara">Tara</option>
                    <option value="Louise">Louise</option>
                    <option value="Tracey">Tracey</option>
                    <option value="Hayley">Hayley</option>
                    <option value="Dan">Dan</option>
                </select>
            </div>
            <button class="submit-btn" onclick="processSignIn()">Tap to Sign In</button>
        </div>
        
        <div id="signout-pane" class="form-pane">
            <p style="font-size: 14px; color: #718096; margin-bottom: 10px;">Tap your name to check out securely:</p>
            <div id="visitor-buttons-container" class="signout-grid">
                </div>
        </div>
        
        <div id="status-display"></div>
    </div>

    <script>
        // PRESERVED ORIGINAL SCRIPT LINK 
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOWtAVh3BZa1FXDtAqj1u2AxO3OoHlitEd-EoozodamzBX8z_epaVLrVgmNdanM6P1/exec"; 

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-pane').forEach(p => p.classList.remove('active'));
            document.getElementById('status-display').innerText = "";
            
            if (tabName === 'signin') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('signin-pane').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('signout-pane').classList.add('active');
                fetchPresentVisitors();
            }
        }

        // ASKS GOOGLE FOR A LIST OF ACTIVE GUESTS
        function fetchPresentVisitors() {
            const container = document.getElementById('visitor-buttons-container');
            container.innerHTML = "<div class='no-visitors'>Loading active directory...</div>";
            sendJsonpRequest(`${GOOGLE_WEB_APP_URL}?action=getPresent&callback=renderVisitorButtons`);
        }

        // CONVERTS NAMES INTO ONE-TAP BUTTONS
        function renderVisitorButtons(data) {
            const container = document.getElementById('visitor-buttons-container');
            container.innerHTML = "";
            
            if (data.status === "success" && data.clients && data.clients.length > 0) {
                data.clients.forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = 'name-tap-button';
                    btn.innerHTML = `👋 ${name}`;
                    btn.onclick = () => processSignOut(name);
                    container.appendChild(btn);
                });
            } else {
                container.innerHTML = "<div class='no-visitors'>No clients are currently signed in.</div>";
            }
        }

        function processSignIn() {
            const name = document.getElementById('client-name').value.trim();
            const email = document.getElementById('client-email').value.trim();
            const carReg = document.getElementById('car-reg').value.trim();
            const host = document.getElementById('staff-select').value;
            const statusDisplay = document.getElementById('status-display');

            if (!name || !email || !host) {
                statusDisplay.innerText = "⚠️ Please enter your Name, Email, and pick a Practitioner.";
                statusDisplay.style.color = "#dd6b20";
                return;
            }

            document.getElementById('signin-pane').style.visibility = "hidden";
            statusDisplay.innerText = "Processing Check-In...";
            statusDisplay.style.color = "#dd6b20";

            const url = `${GOOGLE_WEB_APP_URL}?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&carReg=${encodeURIComponent(carReg)}&host=${encodeURIComponent(host)}&status=PRESENT&callback=handleGlobalResponse`;
            sendJsonpRequest(url);
        }

        function processSignOut(targetName) {
            const statusDisplay = document.getElementById('status-display');
            document.getElementById('signout-pane').style.visibility = "hidden";
            statusDisplay.innerText = "Processing Check-Out...";
            statusDisplay.style.color = "#dd6b20";

            const url = `${GOOGLE_WEB_APP_URL}?name=${encodeURIComponent(targetName)}&status=DEPARTED&callback=handleGlobalResponse`;
            sendJsonpRequest(url);
        }

        function handleGlobalResponse(data) {
            const statusDisplay = document.getElementById('status-display');
            if (data.status === "success") {
                statusDisplay.innerHTML = `✔ Action Completed Successfully!<br><span style="font-size:16px; font-weight:normal; color:#4a5568;">Thank you, the ledger has been updated.</span>`;
                statusDisplay.style.color = "#38a169";
            } else {
                statusDisplay.innerText = "❌ System Sync Error. Please tell your practitioner.";
                statusDisplay.style.color = "#e53e3e";
            }
            setTimeout(resetTerminalSystem, 6000);
        }

        function sendJsonpRequest(url) {
            const oldScript = document.getElementById('jsonp-agent');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-agent';
            script.src = url;
            script.onerror = function() {
                document.getElementById('status-display').innerText = "Connection Error. Please see your practitioner.";
                document.getElementById('status-display').style.color = "#e53e3e";
                setTimeout(resetTerminalSystem, 5000);
            };
            document.body.appendChild(script);
        }

        function resetTerminalSystem() {
            const agent = document.getElementById('jsonp-agent');
            if (agent) agent.remove();

            document.getElementById('client-name').value = "";
            document.getElementById('client-email').value = "";
            document.getElementById('car-reg').value = "";
            document.getElementById('staff-select').selectedIndex = 0;
            document.getElementById('status-display').innerText = "";
            
            document.getElementById('signin-pane').style.visibility = "visible";
            document.getElementById('signout-pane').style.visibility = "visible";
            
            switchTab('signin');
        }
    </script>
</body>
</html>
